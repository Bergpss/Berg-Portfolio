<!DOCTYPE html>
<html lang="zh-CN">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>I'm Berg</title>
    <link rel="icon" type="image/png" sizes="32x32" href="images/favicon.png">
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@400;500;600&display=swap" rel="stylesheet">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: 'Inter', -apple-system, BlinkMacSystemFont, sans-serif;
            background: #0a0a0a;
            color: #fafafa;
            min-height: 100vh;
            display: flex;
            align-items: center;
            justify-content: center;
            padding: 2rem;
        }

        .container {
            text-align: center;
            max-width: 400px;
        }

        h1 {
            font-size: 2.5rem;
            font-weight: 600;
            margin-bottom: 3rem;
            letter-spacing: -0.02em;
        }

        .section {
            margin-bottom: 2.5rem;
        }

        .section-title {
            font-size: 0.75rem;
            text-transform: uppercase;
            letter-spacing: 0.1em;
            color: #666;
            margin-bottom: 1rem;
        }

        .links {
            display: flex;
            justify-content: center;
            gap: 2rem;
        }

        .links a {
            color: #fafafa;
            text-decoration: none;
            font-size: 0.95rem;
            transition: color 0.2s ease;
            display: flex;
            align-items: center;
            gap: 0.5rem;
        }

        .links a:hover {
            color: #888;
        }

        .projects {
            display: flex;
            flex-direction: column;
            gap: 0.75rem;
        }

        .projects a {
            color: #fafafa;
            text-decoration: none;
            font-size: 0.95rem;
            padding: 0.75rem 1.5rem;
            border: 1px solid #333;
            border-radius: 8px;
            transition: all 0.2s ease;
        }

        .projects a:hover {
            background: #1a1a1a;
            border-color: #555;
        }

        .project-name {
            font-weight: 500;
        }

        .project-desc {
            color: #666;
            font-size: 0.8rem;
            margin-top: 0.25rem;
        }

        /* X icon */
        .icon-x {
            width: 16px;
            height: 16px;
        }

        /* 小红书 icon - simplified book shape */
        .icon-xhs {
            width: 16px;
            height: 16px;
            background: #fe2c55;
            border-radius: 3px;
            display: inline-block;
        }
    </style>
</head>

<body>
    <div class="container">
        <h1>Berg</h1>

        <div class="section">
            <div class="section-title">社交媒体</div>
            <div class="links">
                <a href="https://x.com/PssBerg" target="_blank" rel="noopener noreferrer">
                    <svg class="icon-x" viewBox="0 0 24 24" fill="currentColor">
                        <path
                            d="M18.244 2.25h3.308l-7.227 8.26 8.502 11.24H16.17l-5.214-6.817L4.99 21.75H1.68l7.73-8.835L1.254 2.25H8.08l4.713 6.231zm-1.161 17.52h1.833L7.084 4.126H5.117z" />
                    </svg>
                    X
                </a>
                <a href="https://xhslink.com/m/3w6wYE0uSg6" target="_blank" rel="noopener noreferrer">
                    <span class="icon-xhs"></span>
                    小红书
                </a>
            </div>
        </div>

        <div class="section">
            <div class="section-title">Vibe Coding 作品</div>
            <div class="projects">
                <a href="https://aa.guoyibo.top" target="_blank" rel="noopener noreferrer">
                    <div class="project-name">VibeSplit</div>
                    <div class="project-desc">简约 AA 分摊工具</div>
                </a>
                <a href="https://movie.guoyibo.top" target="_blank" rel="noopener noreferrer">
                    <div class="project-name">Movie Gallery</div>
                    <div class="project-desc">我的观影记录</div>
                </a>
                <a href="https://game.guoyibo.top" target="_blank" rel="noopener noreferrer">
                    <div class="project-name">Game Gallery</div>
                    <div class="project-desc">我的游戏记录</div>
                </a>
                <a href="https://santa-hat.guoyibo.top" target="_blank" rel="noopener noreferrer">
                    <div class="project-name">Santa Hat Generator</div>
                    <div class="project-desc">AI 圣诞帽生成器</div>
                </a>
            </div>
        </div>
    </div>
</body>

</html>
