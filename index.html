<!DOCTYPE html>
<html lang="zh-CN">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Berg</title>
  <meta name="description" content="Berg — Living with my best friend and our cat.">
  <link rel="icon" type="image/svg+xml" href="images/favicon.svg">
  <link rel="apple-touch-icon" href="images/apple-touch-icon.png">

  <style>
    /* ============================================
       设计变量（浅色）
       ============================================ */
    :root {
      --bg:     #fbfbfa;
      --text:   #1a1a1a;
      --muted:  #6b6b6b;
      --faint:  #a3a3a3;
      --line:   #e8e8e6;
      --hover:  #f2f2f0;
      --accent: #1a1a1a;
    }

    /* ============================================
       设计变量（深色）—— 跟随系统设置
       ============================================ */
    @media (prefers-color-scheme: dark) {
      :root {
        --bg:     #131313;
        --text:   #ededed;
        --muted:  #9a9a9a;
        --faint:  #666;
        --line:   #262626;
        --hover:  #1c1c1c;
        --accent: #ededed;
      }
    }

    * { margin: 0; padding: 0; box-sizing: border-box; }

    body {
      background: var(--bg);
      color: var(--text);
      font-family: -apple-system, BlinkMacSystemFont, "PingFang SC", "Hiragino Sans GB",
                   "Microsoft YaHei", "Segoe UI", sans-serif;
      font-size: 15px;
      line-height: 1.7;
      -webkit-font-smoothing: antialiased;
    }

    a { color: inherit; text-decoration: none; }

    a:focus-visible {
      outline: 2px solid var(--accent);
      outline-offset: 3px;
      border-radius: 4px;
    }

    /* ============================================
       布局
       ============================================ */
    .page {
      max-width: 560px;
      margin: 0 auto;
      padding: 96px 20px 64px;
    }

    /* ============================================
       个人介绍
       ============================================ */
    .intro { margin-bottom: 64px; }

    .avatar {
      width: 80px;
      height: 80px;
      border-radius: 50%;
      object-fit: cover;
      object-position: center top;
      display: block;
      margin-bottom: 24px;
    }

    .intro h1 {
      font-size: 22px;
      font-weight: 600;
      letter-spacing: -0.01em;
      margin-bottom: 8px;
    }

    .intro p { color: var(--muted); }

    /* ============================================
       分组列表（作品 / 社交）
       ============================================ */
    .section { margin-bottom: 48px; }

    .section h2 {
      font-size: 13px;
      font-weight: 500;
      color: var(--faint);
      margin-bottom: 8px;
    }

    .list { list-style: none; }

    .row {
      display: flex;
      align-items: baseline;
      gap: 12px;
      padding: 12px 10px;
      margin: 0 -10px;
      border-radius: 8px;
      transition: background 0.15s;
    }

    .row:hover { background: var(--hover); }

    .row__name { font-weight: 500; white-space: nowrap; }

    .row__desc {
      color: var(--muted);
      flex: 1;
      min-width: 0;
      overflow: hidden;
      text-overflow: ellipsis;
      white-space: nowrap;
    }

    .row__arrow {
      color: var(--faint);
      transition: transform 0.15s, color 0.15s;
    }

    .row:hover .row__arrow {
      color: var(--text);
      transform: translate(2px, -2px);
    }

    .list li + li { border-top: 1px solid var(--line); }

    /* ============================================
       页脚
       ============================================ */
    .footer {
      font-size: 13px;
      color: var(--faint);
      padding-top: 24px;
      border-top: 1px solid var(--line);
    }

    @media (max-width: 480px) {
      .page { padding-top: 56px; }
    }
  </style>
</head>
<body>

<main class="page">

  <header class="intro">
    <img class="avatar" src="images/avatar.jpg" alt="Berg 的头像">
    <h1>Berg</h1>
    <p>Living with my best friend and our cat.</p>
  </header>

  <section class="section" aria-labelledby="work-title">
    <h2 id="work-title">作品</h2>
    <ul class="list">
      <li>
        <a class="row" href="https://movie.guoyibo.top" target="_blank" rel="noopener">
          <span class="row__name">Movie Gallery</span>
          <span class="row__desc">我的观影记录</span>
          <span class="row__arrow" aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>
  </section>

  <section class="section" aria-labelledby="elsewhere-title">
    <h2 id="elsewhere-title">在别处</h2>
    <ul class="list">
      <li>
        <a class="row" href="https://x.com/PssBerg" target="_blank" rel="noopener">
          <span class="row__name">X</span>
          <span class="row__desc">@PssBerg</span>
          <span class="row__arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li>
        <a class="row" href="https://xhslink.com/m/3w6wYE0uSg6" target="_blank" rel="noopener">
          <span class="row__name">小红书</span>
          <span class="row__desc"></span>
          <span class="row__arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li>
        <a class="row" href="https://v.douyin.com/sH-AyfMzN7U/" target="_blank" rel="noopener">
          <span class="row__name">抖音</span>
          <span class="row__desc"></span>
          <span class="row__arrow" aria-hidden="true">↗</span>
        </a>
      </li>
      <li>
        <a class="row" href="https://space.bilibili.com/29499066" target="_blank" rel="noopener">
          <span class="row__name">bilibili</span>
          <span class="row__desc"></span>
          <span class="row__arrow" aria-hidden="true">↗</span>
        </a>
      </li>
    </ul>
  </section>

  <footer class="footer">© 2026 Berg · guoyibo.top</footer>

</main>

</body>
</html>
